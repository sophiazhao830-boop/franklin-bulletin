<!DOCTYPE html>
<!-- Franklin Academy Front Desk Dashboard — Version 20 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franklin Academy Dashboard</title>
  <style>
    :root {
      --navy: #17365d;
      --navy-dark: #102846;
      --red: #8a2935;
      --red-soft: #f8f2f3;
      --text: #1f2937;
      --muted: #66748a;
      --line: #dde4ec;
      --white: #ffffff;
      --page: #f4f7fa;
      --shadow: 0 8px 28px rgba(17, 39, 68, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--page);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      min-width: 1080px;
      min-height: 607px;
    }

    .dashboard {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 16% 1fr;
      background: var(--page);
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      padding: 1vh 1.8vw;
      background: linear-gradient(120deg, var(--navy-dark), var(--navy));
      color: white;
      border-bottom: 4px solid var(--red);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1 1 auto;
      z-index: 1;
    }

    .brand img {
      height: 12.4vh;
      min-height: 72px;
      max-height: 126px;
      width: auto;
      display: block;
      object-fit: contain;
      background: transparent;
      padding: 0;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.28));
    }

    .datetime {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      min-width: 320px;
      z-index: 2;
    }

    #weekday {
      font-size: clamp(14px, 1.1vw, 20px);
      text-transform: uppercase;
      letter-spacing: .14em;
      color: rgba(255,255,255,.8);
      font-weight: 700;
    }

    #date {
      margin-top: .45vh;
      font-size: clamp(24px, 2vw, 40px);
      font-weight: 700;
    }

    #time {
      margin-top: .35vh;
      font-size: clamp(15px, 1.12vw, 21px);
      color: rgba(255,255,255,.9);
    }

    .weather {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .3vw;
      min-width: 0;
    }

    #weather-icon {
      font-size: clamp(34px, 3vw, 60px);
      line-height: 1;
    }

    .weather-details {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .weather-temp {
      font-size: clamp(28px, 2.6vw, 52px);
      font-weight: 700;
      line-height: .95;
      white-space: nowrap;
    }

    .weather-label {
      margin-top: .45vh;
      font-size: clamp(12px, .86vw, 16px);
      color: rgba(255,255,255,.84);
      text-align: right;
    }

    main {
      display: grid;
      grid-template-columns: 2.05fr 1fr;
      gap: 1.2vw;
      padding: 1.5vh 1.4vw;
      min-height: 0;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: .9vh 1.1vw;
      border-bottom: 1px solid var(--line);
      color: var(--navy);
      font-size: clamp(18px, 1.35vw, 26px);
      font-weight: 700;
    }

    .calendar-wrap {
      height: calc(100% - 52px);
      padding: .8vh .65vw;
      background: white;
    }

    .calendar-shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: .75vh;
      min-height: 0;
    }

    .calendar-month-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 .2vw;
      text-align: center;
    }

    .calendar-month-name {
      color: var(--navy);
      font-size: clamp(20px, 1.55vw, 30px);
      font-weight: 700;
    }

    .calendar-month-tbd {
      display: -webkit-box;
      max-width: 96%;
      overflow: hidden;
      margin-top: .18vh;
      color: var(--muted);
      font-size: clamp(10px, .66vw, 13px);
      font-weight: 600;
      line-height: 1.15;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      min-height: 0;
      overflow: hidden;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .calendar-weekday {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      color: white;
      font-size: clamp(11px, .74vw, 14px);
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .calendar-day {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: .45vh .4vw;
      background: white;
    }

    .calendar-day.outside {
      background: #f7f9fb;
      color: #9aa5b3;
    }

    .calendar-day.today {
      box-shadow: inset 0 0 0 3px var(--red);
    }

    .calendar-day-number {
      margin-bottom: .35vh;
      color: var(--navy);
      font-size: clamp(12px, .86vw, 16px);
      font-weight: 700;
    }

    .calendar-day.outside .calendar-day-number {
      color: #9aa5b3;
    }

    .calendar-event {
      margin-top: .28vh;
      overflow: hidden;
      padding: .4vh .4vw;
      border-left: 4px solid var(--red);
      border-radius: 4px;
      background: var(--red-soft);
      color: #5f1d26;
      font-size: clamp(12px, .82vw, 16px);
      font-weight: 700;
      line-height: 1.2;
      text-overflow: clip;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .calendar-event.closed {
      border-left-color: var(--navy);
      background: #edf3f8;
      color: var(--navy-dark);
    }

    .calendar-event-title {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .calendar-event-note {
      display: -webkit-box;
      overflow: hidden;
      margin-top: .16vh;
      color: #79525a;
      font-size: clamp(10px, .68vw, 13px);
      font-weight: 600;
      line-height: 1.15;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .calendar-event.closed .calendar-event-note {
      color: #566b83;
    }

    .calendar-day.many-events .calendar-event {
      margin-top: .16vh;
      padding: .25vh .3vw;
    }

    .calendar-day.many-events .calendar-event-title {
      -webkit-line-clamp: 2;
    }

    .calendar-day.many-events .calendar-event-note {
      display: none;
    }

    .side {
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(220px, 28vh);
      gap: 1.2vh;
      min-height: 0;
    }

    .side-content {
      padding: 1vh 1vw;
      height: calc(100% - 52px);
      min-height: 0;
      overflow: hidden;
    }

    .key-dates {
      display: grid;
      gap: .7vh;
      height: 100%;
      min-height: 0;
      align-content: stretch;
    }

    .key-date-item {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: .8vw;
      align-items: center;
      border-left: 5px solid var(--red);
      background: var(--red-soft);
      border-radius: 8px;
      padding: .7vh .75vw;
      min-height: 0;
    }

    .key-date-item.closed {
      border-left-color: var(--navy);
      background: #edf3f8;
    }

    .date-chip {
      font-size: clamp(13px, .94vw, 18px);
      color: var(--navy);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .date-name {
      font-size: clamp(15px, 1.06vw, 20px);
      color: var(--text);
      font-weight: 700;
      line-height: 1.22;
    }

    .date-note {
      margin-top: .12vh;
      font-size: clamp(12px, .8vw, 15px);
      color: var(--muted);
      line-height: 1.25;
    }

    .empty-events {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 2vh 1vw;
      border-radius: 8px;
      background: var(--red-soft);
      color: var(--navy);
      font-size: clamp(16px, 1.08vw, 20px);
      font-weight: 700;
      text-align: center;
    }

    .flyer-panel {
      background: #142352;
    }

    .flyer-display {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #142352;
    }

    .flyer-display img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .video-panel .panel-title {
      min-height: 42px;
      font-size: clamp(16px, 1.12vw, 22px);
    }

    .video-content {
      height: 100%;
      min-height: 0;
      padding: 0;
      background: #000;
    }

    .video-player,
    .video-player iframe,
    .video-player video {
      width: 100%;
      height: 100%;
    }

    .video-player {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }

    .video-player iframe,
    .video-player video {
      display: block;
      border: 0;
      background: #000;
      object-fit: contain;
    }

    .video-placeholder {
      display: grid;
      place-content: center;
      height: 100%;
      padding: 1.2vh 1vw;
      color: white;
      text-align: center;
    }

    .video-placeholder-icon {
      margin-bottom: .45vh;
      color: #d7a0a8;
      font-size: clamp(26px, 2vw, 38px);
      line-height: 1;
    }

    .video-placeholder-title {
      font-size: clamp(14px, .95vw, 18px);
      font-weight: 700;
    }

    .video-placeholder-note {
      margin-top: .35vh;
      color: #c8d2df;
      font-size: clamp(10px, .68vw, 13px);
      line-height: 1.3;
    }

    @media (min-width: 1500px) and (min-aspect-ratio: 3/2) {
      main { grid-template-columns: 1.65fr 1fr; }
    }

    @media (max-aspect-ratio: 4/3) {
      body { min-width: 920px; }
      main { grid-template-columns: 2.15fr 1fr; }
      .brand img { height: 10.2vh; }
    }
  </style>
</head>

  const TBD_EVENTS = [

  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const SHORT_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function showVideoPlaceholder(title, note) {
    const player = document.getElementById("video-player");
    player.replaceChildren();

    const placeholder = document.createElement("div");
    placeholder.className = "video-placeholder";
    const icon = document.createElement("div");
    icon.className = "video-placeholder-icon";
    icon.textContent = "▶";
    const heading = document.createElement("div");
    heading.className = "video-placeholder-title";
    heading.textContent = title;
    const message = document.createElement("div");
    message.className = "video-placeholder-note";
    message.textContent = note;
    placeholder.append(icon, heading, message);
    player.appendChild(placeholder);
  }

  const promoVideo = document.getElementById("promo-video");
  const soundMode = new URLSearchParams(window.location.search).get("sound");
  // Always request sound unless the URL explicitly contains ?sound=off.
  // Some TV browsers do not identify themselves as signage players, so
  // user-agent detection can incorrectly leave them muted.
  const requestAutomaticSound = soundMode !== "off";
  let videoRetryTimer = null;
  let soundRetryTimer = null;

  function keepPromoVideoPlaying() {
    if (videoRetryTimer !== null) window.clearTimeout(videoRetryTimer);

    const playRequest = promoVideo.play();
    if (playRequest && typeof playRequest.catch === "function") {
      playRequest.catch(() => {
        // Audible autoplay can be rejected by the browser. Restore muted
        // playback immediately so the TV never remains on the first frame.
        promoVideo.defaultMuted = true;
        promoVideo.muted = true;
        const fallbackRequest = promoVideo.play();
        if (fallbackRequest && typeof fallbackRequest.catch === "function") {
          fallbackRequest.catch(() => {
            videoRetryTimer = window.setTimeout(keepPromoVideoPlaying, 3000);
          });
        }
      });
    }
  }

  function tryAutomaticSignageSound() {
    soundRetryTimer = null;
    if (!requestAutomaticSound || document.hidden) return;

    promoVideo.defaultMuted = false;
    promoVideo.muted = false;
    promoVideo.volume = 1;

    const playRequest = promoVideo.play();
    if (playRequest && typeof playRequest.catch === "function") {
      playRequest.catch(() => {
        promoVideo.defaultMuted = true;
        promoVideo.muted = true;
        promoVideo.play().catch(() => {});
        soundRetryTimer = window.setTimeout(tryAutomaticSignageSound, 10000);
      });
    }
  }

  function scheduleAutomaticSignageSound() {
    if (!requestAutomaticSound || soundRetryTimer !== null || !promoVideo.muted) return;
    soundRetryTimer = window.setTimeout(tryAutomaticSignageSound, 750);
  }

  promoVideo.addEventListener("canplay", keepPromoVideoPlaying, { once: true });
  promoVideo.addEventListener("playing", scheduleAutomaticSignageSound);
  promoVideo.addEventListener("ended", () => {
    promoVideo.currentTime = 0;
    keepPromoVideoPlaying();
  });
  promoVideo.addEventListener("pause", () => {
    if (!document.hidden) {
      videoRetryTimer = window.setTimeout(keepPromoVideoPlaying, 1000);
    }
  });
  promoVideo.addEventListener("error", () => {
    showVideoPlaceholder(
      "Video could not load",
      "Confirm that franklin_academy_promo_2026.mp4 is uploaded beside index.html."
    );
  }, { once: true });

  function resumeVideoPlayback() {
    keepPromoVideoPlaying();
  }

  keepPromoVideoPlaying();

  function todayParts() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: CONFIG.timeZone,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const result = {};
    parts.forEach(part => { if (part.type !== "literal") result[part.type] = part.value; });
    return { year: Number(result.year), month: Number(result.month), day: Number(result.day) };
  }

  function makeKey(year, month, day) {
    return String(year).padStart(4, "0") + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
  }

  function keyParts(key) {
    const values = key.split("-").map(Number);
    return { year: values[0], month: values[1], day: values[2] };
  }

  function displayMonthForDate(today) {
    const date = new Date(Date.UTC(today.year, today.month - 1, today.day));
    const weekEnd = new Date(date);
    weekEnd.setUTCDate(date.getUTCDate() + (6 - date.getUTCDay()));
    return { year: weekEnd.getUTCFullYear(), month: weekEnd.getUTCMonth() + 1 };
  }

  function renderTbdEvents(year, month) {
    const element = document.getElementById("calendar-month-tbd");
    const items = TBD_EVENTS.filter(event => event.year === year && event.month === month);
    if (items.length === 0) {
      element.hidden = true;
      element.textContent = "";
      return;
    }
    element.hidden = false;
    element.textContent = "Dates TBD: " + items.map(event => event.title).join(" • ");
  }

  function formatDateChip(event) {
    const start = keyParts(event.start);
    const end = keyParts(event.end);
    if (event.start === event.end) return [SHORT_MONTHS[start.month - 1] + " " + start.day, String(start.year)];
    if (start.year === end.year) return [SHORT_MONTHS[start.month - 1] + " " + start.day, "to " + SHORT_MONTHS[end.month - 1] + " " + end.day];
    return [SHORT_MONTHS[start.month - 1] + " " + start.day, "to " + SHORT_MONTHS[end.month - 1] + " " + end.day];
  }

  function renderUpcomingEvents(todayKey) {
    const container = document.getElementById("upcoming-events");
    while (container.firstChild) container.removeChild(container.firstChild);
    const upcoming = EVENTS.filter(event => event.end >= todayKey).slice(0, 6);

    if (upcoming.length === 0) {
      container.style.gridTemplateRows = "minmax(0, 1fr)";
      const empty = document.createElement("div");
      empty.className = "empty-events";
      empty.textContent = "No upcoming events or holidays are currently listed.";
      container.appendChild(empty);
      return;
    }

    container.style.gridTemplateRows = "repeat(" + upcoming.length + ", minmax(0, 1fr))";

    upcoming.forEach(event => {
      const item = document.createElement("div");
      item.className = "key-date-item" + (event.closed ? " closed" : "");

      const chip = document.createElement("div");
      chip.className = "date-chip";
      const lines = formatDateChip(event);
      chip.appendChild(document.createTextNode(lines[0]));
      chip.appendChild(document.createElement("br"));
      chip.appendChild(document.createTextNode(lines[1]));

      const details = document.createElement("div");
      const name = document.createElement("div");
      name.className = "date-name";
      name.textContent = event.title;
      const note = document.createElement("div");
      note.className = "date-note";
      note.textContent = event.note;
      details.appendChild(name);
      details.appendChild(note);
      item.appendChild(chip);
      item.appendChild(details);
      container.appendChild(item);
    });
  }

  function renderCalendar(year, month, todayKey) {
    document.getElementById("calendar-month-name").textContent = MONTHS[month - 1] + " " + year;
    renderTbdEvents(year, month);
    const grid = document.getElementById("calendar-grid");
    grid.setAttribute("aria-label", MONTHS[month - 1] + " " + year + " Franklin Academy events calendar");
    while (grid.firstChild) grid.removeChild(grid.firstChild);

    WEEKDAYS.forEach(day => {
      const label = document.createElement("div");
      label.className = "calendar-weekday";
      label.textContent = day;
      grid.appendChild(label);
    });

    const firstWeekday = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
    const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
    const weekCount = Math.ceil((firstWeekday + daysInMonth) / 7);
    grid.style.gridTemplateRows = "34px repeat(" + weekCount + ", minmax(0, 1fr))";

    for (let index = 0; index < weekCount * 7; index += 1) {
      const date = new Date(Date.UTC(year, month - 1, index - firstWeekday + 1));
      const cellYear = date.getUTCFullYear();
      const cellMonth = date.getUTCMonth() + 1;
      const cellDay = date.getUTCDate();
      const cellKey = makeKey(cellYear, cellMonth, cellDay);
      const isCurrentMonth = cellMonth === month;
      const cell = document.createElement("div");
      cell.className = "calendar-day" + (isCurrentMonth ? "" : " outside") + (cellKey === todayKey ? " today" : "");

      const number = document.createElement("div");
      number.className = "calendar-day-number";
      number.textContent = cellDay;
      cell.appendChild(number);

      const cellEvents = EVENTS.filter(event => {
        if (event.display === "start") return event.start === cellKey;
        return event.start <= cellKey && event.end >= cellKey;
      });
      if (cellEvents.length > 1) cell.classList.add("many-events");

      cellEvents.forEach(event => {
        const badge = document.createElement("div");
        badge.className = "calendar-event" + (event.closed ? " closed" : "");
        const badgeTitle = document.createElement("div");
        badgeTitle.className = "calendar-event-title";
        badgeTitle.textContent = event.short;
        const badgeNote = document.createElement("div");
        badgeNote.className = "calendar-event-note";
        badgeNote.textContent = event.note;
        badge.appendChild(badgeTitle);
        badge.appendChild(badgeNote);
        badge.title = event.title + " — " + event.note;
        cell.appendChild(badge);
      });
      grid.appendChild(cell);
    }
  }

  function renderEventViews() {
    const today = todayParts();
    const todayKey = makeKey(today.year, today.month, today.day);
    const displayMonth = displayMonthForDate(today);
    renderCalendar(displayMonth.year, displayMonth.month, todayKey);
  }

  renderEventViews();
  setInterval(renderEventViews, 15 * 60 * 1000);

  let clockTimer = null;
  let lastClockMinute = "";

  function updateDateTime(forceUpdate) {
    const now = new Date();
    const minuteKey = String(Math.floor(now.getTime() / 60000));

    if (!forceUpdate && minuteKey === lastClockMinute) return;
    lastClockMinute = minuteKey;

    document.getElementById("weekday").textContent =
      new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        timeZone: CONFIG.timeZone
      }).format(now).toUpperCase();

    document.getElementById("date").textContent =
      new Intl.DateTimeFormat("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric",
        timeZone: CONFIG.timeZone
      }).format(now);

    document.getElementById("time").textContent =
      new Intl.DateTimeFormat("en-US", {
        hour: "numeric",
        minute: "2-digit",
        timeZone: CONFIG.timeZone
      }).format(now);
  }

  function scheduleClockTick() {
    updateDateTime(false);
    const nextTickDelay = 1000 - (Date.now() % 1000) + 25;
    clockTimer = window.setTimeout(scheduleClockTick, nextTickDelay);
  }

  function refreshAfterWake() {
    if (clockTimer !== null) window.clearTimeout(clockTimer);
    updateDateTime(true);
    renderEventViews();
    resumeVideoPlayback();
    scheduleClockTick();
  }

  scheduleClockTick();
  window.addEventListener("pageshow", refreshAfterWake);
  window.addEventListener("focus", refreshAfterWake);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshAfterWake();
  });

  const WEATHER = {
    0: ["☀️", "Clear"],
    1: ["🌤️", "Mostly clear"],
    2: ["⛅", "Partly cloudy"],
    3: ["☁️", "Cloudy"],
    45: ["🌫️", "Fog"],
    48: ["🌫️", "Fog"],
    51: ["🌦️", "Light drizzle"],
    53: ["🌦️", "Drizzle"],
    55: ["🌧️", "Heavy drizzle"],
    61: ["🌦️", "Light rain"],
    63: ["🌧️", "Rain"],
    65: ["🌧️", "Heavy rain"],
    71: ["🌨️", "Light snow"],
    73: ["🌨️", "Snow"],
    75: ["❄️", "Heavy snow"],
    80: ["🌦️", "Rain showers"],
    81: ["🌧️", "Rain showers"],
    82: ["⛈️", "Heavy showers"],
    95: ["⛈️", "Thunderstorm"],
    96: ["⛈️", "Thunderstorm"],
    99: ["⛈️", "Thunderstorm"]
  };

  async function updateWeather() {
    const temp = document.getElementById("temperature");
    const icon = document.getElementById("weather-icon");
    const desc = document.getElementById("weather-description");

    try {
      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + encodeURIComponent(CONFIG.latitude) +
        "&longitude=" + encodeURIComponent(CONFIG.longitude) +
        "&current=temperature_2m,weather_code" +
        "&temperature_unit=fahrenheit" +
        "&timezone=" + encodeURIComponent(CONFIG.timeZone);

      const response = await fetch(url);
      if (!response.ok) throw new Error("Weather service unavailable");

      const data = await response.json();
      const current = data.current || {};
      const code = Number(current.weather_code);
      const weather = WEATHER[code] || ["🌤️", "Current conditions"];

      temp.textContent = Math.round(Number(current.temperature_2m));
      icon.textContent = weather[0];
      desc.textContent = weather[1];
    } catch (error) {
      temp.textContent = "--";
      icon.textContent = "🌤️";
      desc.textContent = "Weather unavailable";
    }
  }

  updateWeather();
  setInterval(updateWeather, 15 * 60 * 1000);
