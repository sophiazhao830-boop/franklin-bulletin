<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franklin Video Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b2a44; color: #fff; font-family: Arial, Helvetica, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }
  header { padding: 2vh 3vw 1vh; }
  #step { font-size: 5vh; font-weight: 700; }
  #desc { font-size: 3vh; color: #cfd8e6; margin-top: .6vh; }
  #stage { display: grid; place-items: center; min-height: 0; padding: 1vh 3vw; }
  .frame { position: relative; width: 70vw; height: calc(70vw * 9 / 16); max-height: 58vh; max-width: calc(58vh * 16 / 9); background: #000; }
  .rounded { border-radius: 16px; overflow: hidden; border: 1px solid #8fa3c0; }
  .frame video, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: 0; background: #000; object-fit: contain; }
  .own-layer { transform: translateZ(0); will-change: transform; }
  footer { padding: 1vh 3vw 2vh; font-size: 2.6vh; line-height: 1.45; }
  #status { font-size: 3.2vh; font-weight: 700; }
  #ua { color: #9fb0c8; font-size: 1.9vh; word-break: break-all; margin-top: .6vh; }
  .ok { color: #7ee08a; } .bad { color: #ff8a8a; }
</style>
</head>
<body>
<header>
  <div id="step">Franklin video test: starting…</div>
  <div id="desc">Each test runs for about 20 seconds, then the next one starts. The cycle repeats.</div>
</header>
<div id="stage"></div>
<footer>
  <div id="status">Waiting…</div>
  <div id="ua"></div>
</footer>
<script>
(() => {
  const VIDEO_FILE = "https://sophiazhao830-boop.github.io/franklin-bulletin/franklin-academy-video.mp4";
  const TEST_SECONDS = 20;
  const TESTS = [
    { name: "TEST 1 of 4: Plain video", desc: "Square corners, no clipping.", rounded: false, canvas: false, layer: false },
    { name: "TEST 2 of 4: Rounded box", desc: "Same rounded, clipped corners as the dashboard panel.", rounded: true, canvas: false, layer: false },
    { name: "TEST 3 of 4: Canvas drawing", desc: "Rounded box; each frame is drawn onto a canvas.", rounded: true, canvas: true, layer: false },
    { name: "TEST 4 of 4: Own layer", desc: "Rounded box; the video gets its own graphics layer.", rounded: true, canvas: false, layer: true }
  ];

  const stage = document.getElementById("stage");
  const stepEl = document.getElementById("step");
  const descEl = document.getElementById("desc");
  const statusEl = document.getElementById("status");
  document.getElementById("ua").textContent = "Player: " + navigator.userAgent;

  const probe = document.createElement("canvas");
  probe.width = 32; probe.height = 18;
  const probeCtx = probe.getContext("2d", { willReadFrequently: true });

  let current = null;
  let index = 0;

  function frameCheck(video) {
    // Reads a tiny copy of the current frame. "Picture found" means the
    // decoder is producing real images, even if the screen shows black.
    if (video.readyState < 2) return "no frame yet";
    try {
      probeCtx.drawImage(video, 0, 0, probe.width, probe.height);
      const d = probeCtx.getImageData(0, 0, probe.width, probe.height).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += d[i] + d[i + 1] + d[i + 2];
      const avg = sum / (d.length / 4) / 3;
      return avg > 8 ? "picture found" : "black frame";
    } catch (e) {
      return "check failed (" + e.name + ")";
    }
  }

  function stopCurrent() {
    if (!current) return;
    current.stopped = true;
    clearInterval(current.statusTimer);
    const v = current.video;
    v.pause();
    v.removeAttribute("src");
    v.load();
    stage.replaceChildren();
    current = null;
  }

  function startTest(t) {
    stopCurrent();
    stepEl.textContent = t.name;
    descEl.textContent = t.desc;

    const frame = document.createElement("div");
    frame.className = "frame" + (t.rounded ? " rounded" : "");
    const video = document.createElement("video");
    video.crossOrigin = "anonymous";
    video.src = VIDEO_FILE;
    video.autoplay = true;
    video.loop = true;
    video.playsInline = true;
    video.preload = "auto";
    if (t.layer) video.className = "own-layer";
    frame.appendChild(video);

    const state = { video, stopped: false, statusTimer: null, drawn: 0, failed: false };

    if (t.canvas) {
      const canvas = document.createElement("canvas");
      frame.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      const draw = () => {
        if (state.stopped) return;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        if (video.readyState >= 2 && video.videoWidth) {
          const s = Math.min(w / video.videoWidth, h / video.videoHeight);
          const dw = video.videoWidth * s, dh = video.videoHeight * s;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(video, (w - dw) / 2, (h - dh) / 2, dw, dh);
          state.drawn++;
        }
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
    }

    stage.appendChild(frame);
    current = state;

    const tryPlay = () => {
      video.muted = false;
      const p = video.play();
      if (p && p.catch) p.catch(() => { video.muted = true; video.play().catch(() => {}); });
    };
    tryPlay();

    video.addEventListener("error", () => {
      state.failed = true;
      statusEl.innerHTML = '<span class="bad">Video failed to load (error ' + (video.error ? video.error.code : "?") + ').</span>';
    });

    state.statusTimer = setInterval(() => {
      if (state.failed) return;
      const check = frameCheck(video);
      const cls = check === "picture found" ? "ok" : "bad";
      statusEl.innerHTML =
        "Time " + video.currentTime.toFixed(1) + " s · " +
        (video.paused ? "paused" : "playing") + " · " +
        (video.muted ? "muted" : "sound on") + " · size " +
        video.videoWidth + "×" + video.videoHeight +
        ' · frame check: <span class="' + cls + '">' + check + "</span>" +
        (t.canvas ? " · canvas frames " + state.drawn : "");
    }, 1000);
  }

  function next() {
    startTest(TESTS[index]);
    index = (index + 1) % TESTS.length;
  }

  // Wait a few seconds so AbleSign has finished showing the page.
  setTimeout(() => { next(); setInterval(next, TEST_SECONDS * 1000); }, 4000);
})();
</script>
</body>
</html>
